name: edupulse

services:
  postgres:
    image: postgres:16-alpine
    container_name: edupulse-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-edupulse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-edupulse}
      POSTGRES_DB: ${POSTGRES_DB:-edupulse}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-edupulse} -d ${POSTGRES_DB:-edupulse}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - edupulse-net

  redis:
    image: redis:7-alpine
    container_name: edupulse-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - edupulse-net

  # §44 local-first AI. No `depends_on` from `api`: the AI Gateway must
  # degrade gracefully (a typed error + a logged AIUsageRecord) when Ollama
  # is absent, not block API startup on it (§43 — LLMs are supporting
  # components, never a hard dependency of the core system).
  ollama:
    image: ollama/ollama:latest
    container_name: edupulse-ollama
    restart: unless-stopped
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - edupulse-net

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: edupulse-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-edupulse}:${POSTGRES_PASSWORD:-edupulse}@postgres:5432/${POSTGRES_DB:-edupulse}
      # A separate database, not a separate DATABASE_URL override at test
      # time, is deliberate: pytest must never be able to accidentally target
      # the real dev database just because an env var wasn't set (§86).
      TEST_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-edupulse}:${POSTGRES_PASSWORD:-edupulse}@postgres:5432/edupulse_test
      REDIS_URL: redis://redis:6379/0
      TEST_REDIS_URL: redis://redis:6379/15
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./apps/api:/app
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - edupulse-net

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: edupulse-web
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      - api
    volumes:
      - ./apps/web:/app
      - /app/node_modules
      - /app/.next
    networks:
      - edupulse-net

networks:
  edupulse-net:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  ollama_data:
