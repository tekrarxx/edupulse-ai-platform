name: edupulse

services:
  postgres:
    image: postgres:16-alpine
    container_name: edupulse-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-edupulse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-edupulse}
      POSTGRES_DB: ${POSTGRES_DB:-edupulse}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-edupulse} -d ${POSTGRES_DB:-edupulse}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - edupulse-net

  redis:
    image: redis:7-alpine
    container_name: edupulse-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - edupulse-net

  # §44 local-first AI. No `depends_on` from `api`: the AI Gateway must
  # degrade gracefully (a typed error + a logged AIUsageRecord) when Ollama
  # is absent, not block API startup on it (§43 — LLMs are supporting
  # components, never a hard dependency of the core system).
  ollama:
    image: ollama/ollama:latest
    container_name: edupulse-ollama
    restart: unless-stopped
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - edupulse-net

  # §92 workflows/scheduled-tasks orchestration. No core Prometheus/domain
  # logic lives here — n8n only calls real API endpoints on a schedule; the
  # application itself remains the source of truth (§92 explicit rule).
  n8n:
    image: n8nio/n8n:latest
    container_name: edupulse-n8n
    restart: unless-stopped
    environment:
      N8N_BASIC_AUTH_ACTIVE: "true"
      N8N_BASIC_AUTH_USER: ${N8N_BASIC_AUTH_USER:-admin}
      N8N_BASIC_AUTH_PASSWORD: ${N8N_BASIC_AUTH_PASSWORD:-change-me-in-local-env}
      # Encrypts stored credentials (e.g. the scheduler service account's
      # password) at rest in n8n's own SQLite DB — never committed (§79).
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:-change-me-in-local-env}
      GENERIC_TIMEZONE: ${N8N_TIMEZONE:-UTC}
      # Read by infrastructure/n8n/workflows/retention-checkpoint-scheduler.json
      # via {{ $env.* }} expressions — never written into the committed
      # workflow JSON itself (§79).
      API_BASE_URL: http://api:8000
      RETENTION_SCHEDULER_EMAIL: ${RETENTION_SCHEDULER_EMAIL:-}
      RETENTION_SCHEDULER_PASSWORD: ${RETENTION_SCHEDULER_PASSWORD:-}
      # n8n blocks `$env` access from node expressions by default (a real
      # behavior confirmed while building this workflow, not assumed) —
      # this container only ever holds the three env vars above beyond
      # n8n's own config, so allowing expression access to them is a
      # deliberate, scoped exception, not a broad secrets leak.
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
    ports:
      - "${N8N_PORT:-5678}:5678"
    volumes:
      - n8n_data:/home/node/.n8n
      - ./infrastructure/n8n/workflows:/workflows:ro
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5678/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - edupulse-net

  # Local-dev-only SMTP catcher (§9-11 local-first — no external email
  # provider/API key). Every email the API sends (currently just password
  # reset) lands here instead of a real inbox; the web UI at :8025 lets a
  # developer read it like a real mailbox. Swapping this for a real
  # transactional-email provider in production is a separate, explicit
  # decision (§119 — infra adapters change, domain logic doesn't) — nothing
  # in app/services/email_service.py is Mailpit-specific, it just talks SMTP.
  mailpit:
    image: axllent/mailpit:latest
    container_name: edupulse-mailpit
    restart: unless-stopped
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${MAILPIT_WEB_PORT:-8025}:8025"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8025/readyz"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - edupulse-net

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: edupulse-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-edupulse}:${POSTGRES_PASSWORD:-edupulse}@postgres:5432/${POSTGRES_DB:-edupulse}
      # A separate database, not a separate DATABASE_URL override at test
      # time, is deliberate: pytest must never be able to accidentally target
      # the real dev database just because an env var wasn't set (§86).
      TEST_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-edupulse}:${POSTGRES_PASSWORD:-edupulse}@postgres:5432/edupulse_test
      REDIS_URL: redis://redis:6379/0
      TEST_REDIS_URL: redis://redis:6379/15
      # `localhost` inside this container is the container itself, not the
      # host — confirmed by a real connectivity test (ADR-015 addendum):
      # `localhost:11434` from inside `api` fails even when Ollama is
      # actually running on the host. `host.docker.internal` is Docker
      # Desktop's (Win/Mac) standard alias for the host; `extra_hosts`
      # below makes the same alias resolve on native Linux Docker too, so
      # this override works identically on every platform this compose
      # file targets. Whether Ollama is actually running is a separate,
      # runtime concern (§43 — the API must still start and degrade
      # gracefully if it isn't).
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailpit:
        condition: service_healthy
    volumes:
      - ./apps/api:/app
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - edupulse-net

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: edupulse-web
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      - api
    volumes:
      - ./apps/web:/app
      - /app/node_modules
      - /app/.next
    networks:
      - edupulse-net

networks:
  edupulse-net:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  ollama_data:
  n8n_data:
